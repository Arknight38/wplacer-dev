<!DOCTYPE html>
<html>
<head>
    <title>wplacer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <img src="../icons/icon.png" class="logo">
        <h3>wplacer</h3>
    </div>

    <!-- Status Indicator -->
    <div class="status-indicator">
        <div id="statusDot" class="status-dot active"></div>
        <p id="status">Ready. Tokens will be sent automatically.</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" data-tab="main">Main</button>
        <button class="tab" data-tab="settings">Settings</button>
        <button class="tab" data-tab="overlay">Overlay</button>
    </div>

    <!-- Tab Content -->
    <div class="content">
        <!-- Main Tab -->
        <div id="main" class="tab-content active">
            <div class="stack">
                <button id="sendCookieBtn">Add / Update User</button>
                <button id="clearPawtectBtn">Clear Token Cache</button>
                <button id="logoutBtn" class="destructive">Quick Logout</button>
            </div>

            <div class="divider"></div>
        </div>

        <!-- Settings Tab -->
        <div id="settings" class="tab-content">
            <div class="stack">
                <div class="settings">
                    <div class="row">
                        <label for="port">Server Port</label>
                        <input type="number" id="port" min="1" max="65535" value="3000" class="no-spinner">
                    </div>
                </div>
                <div class="settings">
                    <div class="row">
                        <label for="autoReload">Auto Reload</label>
                        <input type="checkbox" id="autoReload">
                    </div>
                    <span class="setting-description">
                        Automatically reload when tokens are needed
                    </span>
                </div>
                <div class="settings">
                    <div class="row">
                        <label for="autoClear">Auto Clear Cache</label>
                        <input type="checkbox" id="autoClear">
                    </div>
                    <span class="setting-description">
                        Clear token cache if waiting too long
                    </span>
                </div>

                <div class="divider"></div>

                <button id="saveSettingsBtn">Save Settings</button>
            </div>
        </div>

        <!-- Overlay Tab -->
        <div id="overlay" class="tab-content">
            <div class="stack">
                <div class="settings" style="flex-direction:column; align-items:flex-start;">
                    <label>Overlay Image</label>
                    <input type="file" id="overlayFile" accept="image/png,image/jpeg,image/webp"
                           style="font-size:12px; color:var(--text-secondary); width:100%;">
                    <span class="setting-description">Click the canvas to anchor. Image top-left = click point.</span>
                </div>
                <div id="overlayPreview" style="display:none; margin-top:4px; text-align:center;">
                    <img id="overlayThumb" style="max-width:100%; max-height:80px; border-radius:4px; opacity:0.8;">
                    <p id="overlayAnchorText" style="font-size:11px; margin:2px 0;"></p>
                </div>
                <button id="openWplaceBtn" style="margin-top:8px;">Open wplace.live</button>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
